name: Apply current HaruQ V5 to 2026-10-26 saved pre-race predictions
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/haruq-apply-v5-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flagship-web-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy-only-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout archived pre-race scores and current V5 policy
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore unchanged March 21 model and feature definitions for mechanical ticket audit
        shell: bash
        run: |
          set -euo pipefail
          cp research_snapshots/haruqube_20260321/config.py config.py
          cp research_snapshots/haruqube_20260321/features/builder.py features/builder.py
          cp research_snapshots/haruqube_20260321/features/line_features.py features/line_features.py
          test "$(git hash-object config.py)" = 011c2091816d16358dfe478726bcb0ff2bc74bf9
          test "$(git hash-object features/builder.py)" = b47b793b5cf763bcb6d05137a115105006e50eba
          test "$(git hash-object features/line_features.py)" = ecf3ab7c762475946054f806bb1d4b802c889389
      - name: Install frozen-compatible runtime for arithmetic only
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1 requests beautifulsoup4 lxml
      - name: Validate unchanged scores and read-only V5 policy tests
        run: |
          python -m scripts.test_flagship_live
          python -m scripts.test_haruq_f2_publish
      - name: Replay V5 purchase policy on existing archived pre-race predictions, NEVER rerun prediction
        run: python -u -m scripts.haruq_reapply_saved_day_20261026
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haruq-v5-today-20261026-${{ github.run_id }}
          path: flagship_daily_results/20261026_v5_replay_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish updated purchase decisions and immutable new run snapshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/haruq/days/20261026.json docs/haruq/results/*.json docs/haruq/results/runs/*.json
          git diff --cached --quiet && { echo "No daily decision differences"; exit 1; }
          git commit -m "Apply user-approved HaruQ V5 to 2026-10-26 stored pre-race predictions [skip ci]"
          git restore -- config.py features/builder.py features/line_features.py
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "HARUQ_V5_TODAY_WEB_PUBLISHED"
              exit 0
            fi
            sleep 2
          done
          exit 1
