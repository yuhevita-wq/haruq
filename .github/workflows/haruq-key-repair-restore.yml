name: HARUQ key repair - restore and verify independent history
on:
  push:
    branches: [main]
    paths: [.github/workflows/haruq-key-repair-restore.yml]
permissions:
  contents: write
concurrency:
  group: haruq-key-repair
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      GNUPGHOME: /tmp/haruq-key-repair
    steps:
      - name: Download protected recipient, encrypted transfer and original checksum
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$GNUPGHOME" recipient transfer original db release verify
          gh release download haruq-key-repair-recipient-20261024 --repo "$GITHUB_REPOSITORY" --dir recipient
          (cd recipient && sha256sum -c SHA256SUMS.txt)
          gh release download haruq-key-repair-transfer-20261024 --repo yuhevita-wq/keirin-ai-predictor --dir transfer
          (cd transfer && sha256sum -c ENCRYPTED_SHA256SUMS.txt)
          gh release download haruqube-20260321-history-cache-live --repo "$GITHUB_REPOSITORY" --pattern PLAINTEXT_SHA256.txt --dir original
          cmp original/PLAINTEXT_SHA256.txt transfer/PLAINTEXT_SHA256.txt
          gpg --batch --import recipient/recipient-protected-private.asc
      - name: Reencrypt identical history using the new repository existing secret
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,sys; sys.stdout.write(os.environ["COLLECTOR_PASSPHRASE"].rstrip("\r\n"))' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output db/keirin.db --decrypt transfer/keirin-history.transfer.gpg
          (cd db && sha256sum -c ../original/PLAINTEXT_SHA256.txt)
          python -c 'import os,sys; sys.stdout.write(os.environ["COLLECTOR_PASSPHRASE"].rstrip("\r\n"))' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --cipher-algo AES256 --symmetric --output release/keirin-history.sqlite.gpg db/keirin.db
          cp original/PLAINTEXT_SHA256.txt release/
          (cd release && sha256sum keirin-history.sqlite.gpg > ENCRYPTED_SHA256SUMS.txt)
      - name: Independently decrypt new asset and verify SQLite integrity
        shell: bash
        run: |
          set -euo pipefail
          gpgconf --kill gpg-agent
          python -c 'import os,sys; sys.stdout.write(os.environ["COLLECTOR_PASSPHRASE"].rstrip("\r\n"))' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output verify/keirin.db --decrypt release/keirin-history.sqlite.gpg
          (cd verify && sha256sum -c ../original/PLAINTEXT_SHA256.txt)
          cmp db/keirin.db verify/keirin.db
          python -c 'import sqlite3; c=sqlite3.connect("file:verify/keirin.db?mode=ro",uri=True); assert c.execute("PRAGMA quick_check").fetchall()==[("ok",)]; print("HARUQ_NEW_SECRET_DECRYPTION_AND_IDENTICAL_HISTORY_OK")'
          gh release create haruqube-20260321-history-cache-haruq-v1 release/* --repo "$GITHUB_REPOSITORY" --title "HARUQ independent history - lossless key migration" --notes "Same plaintext SHA256 as immutable original history-cache-live. Reencrypted for this repository existing COLLECTOR_PASSPHRASE; independent decrypt, byte comparison and SQLite integrity checks passed. No model, feature, prediction or betting-rule changes." --latest=false
      - name: Delete plaintext history and temporary keys
        if: always()
        run: |
          gpgconf --kill all || true
          rm -rf "$GNUPGHOME" db verify recipient original transfer release
