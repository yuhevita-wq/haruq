name: HaruQ Read-only Validation Parity and Downside Audit
on:
  push:
    branches: [research/validation-parity-20261025]
    paths: [.github/workflows/validation-parity-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage frozen source in ephemeral runner
        run: |
          cp research_snapshots/haruqube_20260321/config.py config.py
          cp research_snapshots/haruqube_20260321/features/builder.py features/builder.py
          cp research_snapshots/haruqube_20260321/features/line_features.py features/line_features.py
          python -m pip install lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 scikit-learn==1.7.2 python-dotenv==1.1.1 requests beautifulsoup4 lxml
      - name: Restore verified existing assets without retraining
        run: |
          set -euo pipefail
          mkdir -p flagship_inputs db
          for name in haruqube_20260321_fresh_model.pkl holdout_all_selected_tickets.csv; do
            gh release download haruqube-20260321-flagship-v1 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir flagship_inputs
          done
          for name in keirin-history.sqlite.gpg PLAINTEXT_SHA256.txt; do
            gh release download haruqube-20260321-history-cache-haruq-v1 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir flagship_inputs
          done
          python -c 'import os,sys; sys.stdout.write(os.environ["COLLECTOR_PASSPHRASE"].rstrip("\r\n"))' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output db/keirin.db --decrypt flagship_inputs/keirin-history.sqlite.gpg
          (cd db && sha256sum -c ../flagship_inputs/PLAINTEXT_SHA256.txt)
      - name: Audit current policy, matched feature values, 21-race windows and concentration
        run: python -u -m scripts.validation_parity_audit
      - name: Retain audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haruq-validation-parity-${{ github.run_id }}
          path: validation_audit/
          retention-days: 60
      - name: Publish research reports on isolated audit branch only
        run: |
          set -euo pipefail
          mkdir -p research_audits/validation_parity_20261025
          cp validation_audit/*.json validation_audit/*.csv research_audits/validation_parity_20261025/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research_audits/validation_parity_20261025/
          git commit -m "Record read-only feature parity and current-policy risk audit [skip ci]"
          git push origin HEAD:research/validation-parity-20261025
      - name: Remove ephemeral plaintext and model
        if: always()
        run: rm -f db/keirin.db flagship_inputs/haruqube_20260321_fresh_model.pkl
