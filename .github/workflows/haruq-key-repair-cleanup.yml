name: HARUQ key repair - remove one-time migration materials
on:
  push:
    branches: [main]
    paths: [.github/workflows/haruq-key-repair-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary protected recipient after successful normal prediction
        run: |
          set -euo pipefail
          test "$(gh run view 40048448605 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh release view haruqube-20260321-history-cache-haruq-v1 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release delete haruq-key-repair-recipient-20261024 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          git rm .github/workflows/haruq-key-repair-prepare.yml .github/workflows/haruq-key-repair-restore.yml .github/workflows/haruq-key-repair-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed one-time key migration workflows and protected transfer key"
          git push origin HEAD:main
