<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハルキュー｜本日の全レース一覧</title><style>
:root{color-scheme:dark;--bg:#080e19;--surface:#131f2d;--surface2:#19293b;--line:#304257;--text:#ebf3ff;--muted:#9aacc2;--gold:#ffd37d;--blue:#94cfff;--red:#e6a5a8;--green:#9df0d0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(70% 450px at 60% -80px,#2e527135,transparent),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--text);line-height:1.58}
.wrap{width:min(1160px,calc(100% - 32px));margin:auto}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
a{color:var(--blue)}header{background:#0c1723ed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:61px}
.brand{text-decoration:none;color:var(--text);font-weight:860;font-size:17px;display:flex;align-items:center;gap:10px}.brand span{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#bde6ff;color:#0d2744;font-weight:900}.prev{font-size:12px;text-decoration:none;color:var(--muted)}
main{padding-top:32px;padding-bottom:80px}.eyebrow{color:var(--blue);font-weight:850;letter-spacing:.15em;font-size:11px}
h1{margin:10px 0 4px;font-size:clamp(27px,5vw,45px);letter-spacing:-.038em;line-height:1.28}.summary-text{color:var(--muted);font-size:13px;margin:10px 0 18px}
.rules{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 23px}.rule{font-size:11px;border:1px solid #425c73;background:#132338;padding:7px 11px;border-radius:99px;color:#bdd7ec;font-weight:700}.rule.main{background:#3d331f;border-color:#9d824f;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#132031;border:1px solid #2c4058;border-radius:15px;padding:14px 16px}.stat small{font-size:10px;color:var(--muted);font-weight:750;display:block;white-space:nowrap}.stat strong{display:block;font-size:clamp(19px,3vw,27px);font-variant-numeric:tabular-nums;letter-spacing:-.035em;margin-top:3px}.stat.money strong{color:var(--gold)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:25px;margin-bottom:8px}
.toolbar small{color:var(--muted);font-size:12px}.btn{border:1px solid #537293;background:#1a314a;color:#eaf5ff;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:800}.btn:hover{background:#254561}.btn.active{background:#b7dfff;color:#0f253b;border-color:#b7dfff}
.venue{margin-top:19px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#101b28}
.venue-head{padding:18px 21px;background:linear-gradient(90deg,#192b3f,#112132);display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.venue-head h2{margin:0;font-size:19px;letter-spacing:-.015em}.venue-head small{color:var(--muted);font-size:12px}
.venue-sum{font-size:12px;color:var(--gold);font-weight:800;white-space:nowrap}
.race{padding:14px 20px;border-top:1px solid #26394b}.race:first-child{border-top:0}.race.buy{background:linear-gradient(90deg,#302719a8,transparent 70%)}.race.failed{background:#1b1b23}
.race-top{display:grid;grid-template-columns:60px minmax(0,1fr) 86px 86px;gap:12px;align-items:center}
.rno{font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}.meta{font-size:11px;color:var(--muted);font-weight:600}
.pick{min-width:0}.pick strong{display:block;font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.pick small{font-size:11px;color:var(--muted)}
.badge{justify-self:end;white-space:nowrap;border-radius:99px;padding:5px 10px;background:#25344a;color:#b6c8dd;font-size:11px;font-weight:830;border:1px solid #445875}
.badge.high{background:#5a4625;border-color:#a8905e;color:#ffe0a1}.badge.skip{background:#1e2938;color:#9ab0c7}.badge.off{background:#2a252b;color:#cbbac4}.amt{text-align:right;font-weight:860;font-size:17px;font-variant-numeric:tabular-nums}.amt.zero{font-weight:600;color:#7c91a8}
.race-actions{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.race-actions button{border:1px solid #48617b;background:#1e3043;border-radius:8px;color:#cceaff;padding:6px 9px;font-size:11px;font-weight:700}
.race-actions a{font-size:11px;color:#b0c3d8;text-underline-offset:3px}.race-actions .score{color:var(--muted);font-size:11px}
.ticket-detail{display:none;margin-top:12px;border:1px solid #455467;border-radius:12px;padding:13px;background:#0e1824}
.race.open .ticket-detail{display:block}.bets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bethead{font-size:11px;font-weight:820;color:var(--blue);letter-spacing:.04em;margin-bottom:6px}.bethead .g{color:var(--gold)}
.combos{display:flex;gap:6px;flex-wrap:wrap}.combo{border:1px solid #435974;border-radius:7px;padding:6px 8px;background:#14253a;font-variant-numeric:tabular-nums;font-size:13px;font-weight:850}.combo strong{color:#fff0c9}
.tips{font-size:11px;color:var(--muted);margin-top:11px;line-height:1.7}
.footer{margin:28px auto 0;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8}
.message{margin:20px 0;border:1px solid #435873;padding:16px 18px;border-radius:13px;background:#142135;color:var(--muted);font-size:13px}
.copy-toast{position:fixed;z-index:20;bottom:23px;left:50%;transform:translateX(-50%);background:#dbf0ff;color:#14253a;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:780;display:none;box-shadow:0 10px 35px #0008}
.hidden{display:none!important}@media(max-width:680px){main{padding-top:24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.venue-head{padding:15px}.race{padding:13px 14px}.race-top{grid-template-columns:47px minmax(0,1fr) 79px;gap:7px}.amt{grid-column:3;grid-row:2;font-size:15px}.badge{grid-column:3;grid-row:1;padding:4px 7px;font-size:10px}.meta{font-size:10px}.pick strong{font-size:12px}.rno{font-size:18px}.bets{grid-template-columns:1fr}.combos .combo{font-size:12px}.rule{font-size:10px}}
</style></head><body><header><div class="wrap"><a class="brand" href="./"><span>H</span>ハルキュー</a><a class="prev" href="./">個別レース →</a></div></header><main class="wrap"><div class="eyebrow">HARUQ / ALL DAILY RACES</div><h1 id="title">本日の全レース</h1><p class="summary-text">本家の固定AIによる判定・AI順位・買い目・金額の一覧です。</p><div class="rules"><span class="rule main">F1・G戦の3連単 S3-HIGH｜6点・各500円</span><span class="rule">F1・G戦の2車単 HIGH｜4点・各500円</span><span class="rule">F2最終日・差2.0以上｜2車単1→3,4の2点・各500円（3連単なし）</span><span class="rule">ガールズ｜対象外</span></div><label>日付 <input id="day" type="date" style="font:inherit;padding:8px;border-radius:8px"></label> <button id="reload" class="btn">表示・更新</button><div class="stats" style="margin-top:20px"><div class="stat"><small>全開催・全レース</small><strong id="all">—</strong></div><div class="stat"><small>判定済／対象外／未判定</small><strong id="counts">—</strong></div><div class="stat"><small>購入対象</small><strong id="buy">—</strong></div><div class="stat money"><small>固定ルール金額</small><strong id="money">—</strong></div></div><div class="toolbar"><small id="status" role="status">読み込み中…</small><div><button id="filter" class="btn">購入対象だけ表示</button> <a id="json" class="btn">全データJSON</a></div></div><nav id="jump" aria-label="競輪場へ移動" style="display:flex;gap:8px;flex-wrap:wrap;margin:18px 0"></nav><div id="venues"></div><p class="footer">発走時刻・出走変更は出走表でご確認ください。対象外・未判定のレースも一覧に表示します。予測作成時刻を各レースに記載しています。</p></main><script src="daily.js"></script></body></html>
